[project]
name = "napi-factory-server"
version = "0.1.0"
description = "NAPI Factory Test: сервер производственного тестирования и прошивки NAPI-C"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.143.0",
    "starlette==1.7.0",
    "pydantic==2.14.0",
    "uvicorn[standard]==0.54.0",
    "websockets==17.2",
    "pyyaml==6.0.3",
    "segno==1.6.6",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.db" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
